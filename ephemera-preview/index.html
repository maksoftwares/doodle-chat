<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#090b12" />
<meta name="description" content="Ephemera is an anonymous, browser-to-browser chat with no message history." />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Ephemera — temporary browser chat</title>
</head>
<body>
<div id="root"></div>
<script src="./payload-css-00.js"></script>
<script src="./payload-js-00.js"></script>
<script src="./payload-js-01.js"></script>
<script src="./payload-js-02.js"></script>
<script src="./payload-js-03.js"></script>
<script src="./payload-js-04.js"></script>
<script type="module">
const unpack = async (parts) => {
  const data = parts.join('');
  const bytes = Uint8Array.from(atob(data), (char) => char.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(stream).text();
};
const css = await unpack(window.__EPH_CSS || []);
const style = document.createElement('style');
style.textContent = css;
document.head.append(style);
const source = await unpack(window.__EPH_JS || []);
const moduleUrl = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
await import(moduleUrl);
URL.revokeObjectURL(moduleUrl);
delete window.__EPH_CSS;
delete window.__EPH_JS;
</script>
</body>
</html>
