<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b12" />
  <meta name="description" content="Ephemera is an anonymous, browser-to-browser chat with no message history." />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Ephemera — temporary browser chat</title>
  <style>
    html,body,#root{min-height:100%;margin:0;background:#090b12;color:#f6f7fb}
    .boot{min-height:100vh;display:grid;place-items:center;font:500 15px system-ui,sans-serif;color:#a5aabd}
    .boot-error{max-width:44rem;padding:2rem;line-height:1.55}
    .boot-error strong{display:block;color:#fff;font-size:1.2rem;margin-bottom:.5rem}
  </style>
</head>
<body>
  <div id="root"><div class="boot">Opening Ephemera…</div></div>
  <script src="./payload-css-00.js"></script>
  <script src="./payload-js-00.js"></script>
  <script src="./payload-js-01.js"></script>
  <script src="./payload-js-02.js"></script>
  <script src="./payload-js-03.js"></script>
  <script src="./payload-js-04.js"></script>
  <script src="./payload-js-05.js"></script>
  <script src="./payload-js-06.js"></script>
  <script src="./payload-js-07.js"></script>
  <script src="./payload-js-08.js"></script>
  <script src="./payload-js-09.js"></script>
  <script src="./payload-js-10.js"></script>
  <script src="./payload-js-11.js"></script>
  <script src="./payload-js-tail-00.js"></script>
  <script src="./payload-js-tail-01.js"></script>
  <script src="./payload-js-tail-02.js"></script>
  <script src="./payload-js-tail-03.js"></script>
  <script src="./payload-js-tail-04.js"></script>
  <script src="./payload-js-tail-05.js"></script>
  <script src="./payload-js-tail-06.js"></script>
  <script src="./payload-js-tail-07.js"></script>
  <script src="./payload-js-tail-08.js"></script>
  <script src="./payload-js-tail-09.js"></script>
  <script src="./payload-js-tail-10.js"></script>
  <script src="./payload-js-tail-11.js"></script>
  <script src="./payload-js-tail-12.js"></script>
  <script src="./payload-js-tail-13.js"></script>
  <script src="./payload-js-tail-14-00.js"></script>
  <script src="./payload-js-tail-14-01-00.js"></script>
  <script src="./payload-js-tail-14-01-01.js"></script>
  <script src="./payload-js-tail-15-00-00.js"></script>
  <script src="./payload-js-tail-15-00-01-00.js"></script>
  <script src="./payload-js-tail-15-00-01-01.js"></script>
  <script src="./payload-js-tail-15-01-00-00.js"></script>
  <script src="./payload-js-tail-15-01-00-01.js"></script>
  <script src="./payload-js-tail-15-01-01-00.js"></script>
  <script src="./payload-js-tail-15-01-01-01.js"></script>
  <script src="./payload-js-tail-16-00.js"></script>
  <script>
  (() => {
    const EXPECTED_JS_PAYLOAD_LENGTH = 124096;
    const unpack = async (parts, expectedLength) => {
      const payload = parts.join('');
      if (expectedLength && payload.length !== expectedLength) {
        throw new Error(`The deployed app bundle is incomplete (${payload.length}/${expectedLength} characters).`);
      }
      const bytes = Uint8Array.from(atob(payload), character => character.charCodeAt(0));
      if (!('DecompressionStream' in window)) {
        throw new Error('This browser does not support DecompressionStream. Use a current Chrome, Edge, Firefox, or Safari release.');
      }
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    };

    Promise.all([
      unpack(window.__EPH_CSS || []),
      unpack(window.__EPH_JS || [], EXPECTED_JS_PAYLOAD_LENGTH)
    ]).then(([css, source]) => {
      const style = document.createElement('style');
      style.textContent = css;
      document.head.appendChild(style);

      const script = document.createElement('script');
      script.type = 'module';
      script.textContent = source;
      document.body.appendChild(script);

      delete window.__EPH_CSS;
      delete window.__EPH_JS;
    }).catch(error => {
      const root = document.getElementById('root');
      root.innerHTML = '<div class="boot boot-error"><div><strong>Ephemera could not start.</strong><span></span></div></div>';
      root.querySelector('span').textContent = error instanceof Error ? error.message : String(error);
      console.error(error);
    });
  })();
  </script>
</body>
</html>
